plugins {
    id "com.android.application"
}

android {
    namespace "io.github.fourjcraft.mcle"
    compileSdk 34
    ndkVersion "30.0.14904198"

    defaultConfig {
        applicationId "io.github.fourjcraft.mcle"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ["src/main/jniLibs"]
            assets.srcDirs = ["../../build/targets/resources"]
        }
    }
}

dependencies {
}

tasks.register("buildNativeArm64", Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine = ["python3", "scripts/android/build_native.py"]
}

tasks.named("preBuild") {
    dependsOn(tasks.named("buildNativeArm64"))
}
