[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'armv8'
endian = 'little'

[binaries]
ar = '@NDK_TOOLCHAIN@/llvm-ar'
strip = '@NDK_TOOLCHAIN@/llvm-strip'
c = '@NDK_TOOLCHAIN@/aarch64-linux-android21-clang'
cpp = '@NDK_TOOLCHAIN@/aarch64-linux-android21-clang++'

[properties]
needs_exe_wrapper = true
c_args = ['-fPIC']
cpp_args = ['-fPIC']
